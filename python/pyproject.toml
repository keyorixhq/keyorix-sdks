[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "keyorix"
version = "0.2.1"
description = "Python client for Keyorix — lightweight on-premise secrets manager"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
dependencies = []
keywords = ["secrets", "security", "devops", "keyorix"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://keyorix.com"
Repository = "https://github.com/keyorixhq/keyorix-sdks/tree/main/python"
Issues = "https://github.com/keyorixhq/keyorix-sdks/issues"

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
    "pre-commit>=3.8",
    "cyclonedx-bom>=4.0",
]

[tool.bandit]
targets = ["keyorix.py"]
skips = []
