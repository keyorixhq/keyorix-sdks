[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyorix"
version = "0.2.1"
description = "Python client for Keyorix — lightweight on-premise secrets manager"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
dependencies = []
keywords = ["secrets", "security", "devops", "keyorix"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://keyorix.com"
Repository = "https://github.com/keyorixhq/keyorix-sdks/tree/main/python"
Issues = "https://github.com/keyorixhq/keyorix-sdks/issues"

[project.optional-dependencies]
# Exact-pinned, not >= ranges: these are CI/dev tooling, not shipped
# dependencies, but an unpinned range still means CI installs whatever the
# latest release happens to be on any given run -- unpredictable and, for
# a secrets-manager SDK's own supply chain, worth locking down. Versions
# below are each independently verified working (installed + actually run
# against this package) before pinning, not just the newest available.
dev = [
    "bandit[toml]==1.9.4",
    "pip-audit==2.10.1",
    "detect-secrets==1.5.0",
    "pre-commit==4.6.1",
    "cyclonedx-bom==7.3.1",
]

[tool.setuptools]
py-modules = ["keyorix"]

[tool.bandit]
targets = ["keyorix.py"]
skips = []
