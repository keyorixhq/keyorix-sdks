version: 2
updates:
  - package-ecosystem: gomod
    directory: "/go"
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: "/go/examples/petstore"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/node"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/node/examples/petstore"
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: "/python"
    schedule:
      interval: weekly
    # chardet is only a transitive dependency (pulled in via cyclonedx-bom,
    # not pinned directly in pyproject.toml). cyclonedx-bom==7.3.1 requires
    # chardet<6.0, so any >=6 bump is unresolvable and fails the
    # --require-hashes install in CI (see PR #7). Checked PyPI 2026-08-04:
    # 7.3.1 is still cyclonedx-bom's latest release and still pins
    # chardet<6.0 -- this isn't fixed upstream yet. Remove this rule once
    # cyclonedx-bom relaxes that pin to allow chardet>=6; the actual fix
    # when that happens is bumping cyclonedx-bom, not chardet directly.
    ignore:
      - dependency-name: "chardet"
        versions: [">=6"]

  # Carried forward from the imported java/.github/dependabot.yml, path
  # updated for the monorepo layout. The junit-jupiter ignore rule predates
  # this consolidation: JUnit 6 has breaking API changes the source repo
  # explicitly reverted from (see its "revert JUnit to 5.x" commit,
  # imported in full via git subtree) -- carried forward so Dependabot
  # doesn't immediately re-propose the same reverted bump.
  - package-ecosystem: maven
    directory: "/java"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "org.junit.jupiter:junit-jupiter"
        versions: [">=6"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
