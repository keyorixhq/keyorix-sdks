name: DIAG lockgen (throwaway, do not merge)
on:
  pull_request:
    paths: ['.github/workflows/diag-lockgen.yml']
permissions:
  contents: write
jobs:
  lockgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Regenerate lock for the four advisory packages only
        working-directory: python
        run: |
          pip install --no-cache-dir pip-tools
          pip-compile --extra=dev --generate-hashes \
            --upgrade-package 'certifi>=2026.10.19' \
            --upgrade-package 'filelock>=4.2.1' \
            --upgrade-package 'msgpack>=1.2.3' \
            --upgrade-package 'virtualenv>=21.14.9' \
            --output-file=requirements-dev.lock.txt pyproject.toml
          git diff --stat
      - name: Verify with pip-audit (same install as CI)
        working-directory: python
        run: |
          pip install --no-cache-dir --only-binary :all: --require-hashes -r requirements-dev.lock.txt
          pip-audit
      - name: Publish result to scratch branch
        run: |
          git config user.name "Andrei Beshkov"
          git config user.email "andrey.beshkov@gmail.com"
          git add python/requirements-dev.lock.txt
          git commit -m "scratch: regenerated python lock" 
          git push --force origin HEAD:refs/heads/lockgen/output
