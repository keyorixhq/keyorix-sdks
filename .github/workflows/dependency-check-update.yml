name: Dependency-check DB update

# Owns the expensive part of OWASP dependency-check: syncing the local NVD
# CVE database. Split out from java.yml's per-PR "SCA scan" job because a
# full from-scratch sync without an NVD_API_KEY is throttled by NVD to a
# crawl (confirmed live: 372,902 records at ~4,800/min == well over an hour)
# -- no per-PR job timeout budget can accommodate that, and a job-level
# timeout cancellation isn't something continue-on-error can work around.
#
# Runs weekly and on-demand, with a timeout generous enough to finish a full
# sync even unauthenticated. Saves the resulting DB to the same cache key
# prefix java.yml's SCA scan job restores from (restore-keys prefix match),
# so PR-time checks stay fast and never talk to NVD directly.
#
# NVD_API_KEY is REQUIRED, not a nice-to-have: unauthenticated NVD allows
# ~5 requests/30s against authenticated's ~50/30s, and this sync needs to
# page through 372,917+ records -- structurally, not just occasionally,
# too slow to finish unauthenticated before hitting NVD's own rate limit
# (confirmed live, twice: 16% and 29% downloaded before a 429 on two
# separate unauthenticated runs). The "Update NVD data" step below fails
# outright if the secret is absent, rather than silently falling back to
# unauthenticated and re-hitting the same 429 forty-five minutes later.
# Get a free key at https://nvd.nist.gov/developers/request-an-api-key and
# add it as a repo secret named NVD_API_KEY.
on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 11
          distribution: temurin
          cache: maven

      - name: Compute cache week
        id: cache-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore OWASP dependency-check data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/dependency-check-data
          key: dependency-check-data-${{ steps.cache-week.outputs.week }}
          restore-keys: |
            dependency-check-data-

      - name: Update NVD data
        id: update
        working-directory: java
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::NVD_API_KEY secret is not set. Unauthenticated NVD access is rate-limited too hard to complete this sync (confirmed live: two separate runs hit a 429 after 16% and 29% downloaded) -- get a free key at https://nvd.nist.gov/developers/request-an-api-key and add it as a repo secret named NVD_API_KEY, rather than letting this fall back to unauthenticated and fail the same way again."
            exit 1
          fi
          mvn -B dependency-check:update-only -Dnvd.api.key="$NVD_API_KEY"

      # Deliberately NOT if: always(). A run on 2026-08-04 got rate-limited
      # (NVD 429) 29% of the way through a full sync -- update-only above
      # failed, but with if: always() here the partial database got saved
      # to the cache anyway. That's worse than saving nothing: an absent
      # database makes dependency-check fail loudly (NoDataException,
      # verified live), but a present-and-incomplete one lets the check
      # step run "successfully" against data missing ~70% of NVD's records,
      # with no error at all. Only save what actually finished.
      - name: Save OWASP dependency-check data
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.update.outcome == 'success'
        with:
          path: ~/.m2/dependency-check-data
          key: dependency-check-data-${{ steps.cache-week.outputs.week }}
