version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "org.junit.jupiter:junit-jupiter"
        versions: [ ">=6" ]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
