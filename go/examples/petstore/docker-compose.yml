# Keyorix Pet Store — demo stack
# Demonstrates zero hardcoded credentials using Keyorix secrets manager
#
# Prerequisites:
#   1. Keyorix server running at KEYORIX_SERVER
#   2. Secret "petstore-db-password" exists in production environment
#   3. KEYORIX_TOKEN set to a valid session token
#
# Quick start:
#   export KEYORIX_SERVER=http://host.docker.internal:8080
#   export KEYORIX_TOKEN=$(keyorix connect http://localhost:8080 --username admin --password Admin123! && cat ~/.keyorix/cli.yaml | grep token | awk '{print $2}')
#   docker compose up

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: petstore
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: petstore
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petstore"]
      interval: 5s
      timeout: 3s
      retries: 10

  petstore:
    build: .
    ports:
      - "3001:3001"
    environment:
      KEYORIX_SERVER: ${KEYORIX_SERVER:?KEYORIX_SERVER is required}
      KEYORIX_TOKEN: ${KEYORIX_TOKEN:?KEYORIX_TOKEN is required}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: petstore
      DB_NAME: petstore
    depends_on:
      postgres:
        condition: service_healthy
